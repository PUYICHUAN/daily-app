<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>怎么吃</title>

  <!-- iOS 添加到主屏幕 / PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="怎么吃" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <meta name="theme-color" content="#07C160" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />

  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 顶栏 -->
  <header class="app-header">
    <div class="header-inner">
      <div class="brand">
        <img class="brand-logo" src="icons/icon-192.png" alt="怎么吃" />
        <div class="brand-text">
          <h1 class="brand-name">怎么吃</h1>
          <p class="brand-slogan">每天不重样 · 好好吃饭</p>
        </div>
      </div>
      <button id="shuffleBtn" class="shuffle-btn">🎲 今天吃什么</button>
    </div>
  </header>

  <main class="container">
    <!-- 欢迎横幅 -->
    <section class="hero">
      <div class="hero-text">
        <p class="hero-date" id="heroDate">8月20日 · 周四</p>
        <h2 class="hero-title">今天怎么吃？</h2>
        <p class="hero-sub">为你排好一周不重样的菜谱，点开就能照着做</p>
      </div>
      <div class="hero-veggie">🥦</div>
    </section>

    <!-- 星期日期条 -->
    <nav class="day-strip" id="dayStrip" aria-label="选择星期"></nav>

    <!-- 今日概览 -->
    <div class="day-summary" id="daySummary"></div>

    <!-- 分餐食谱 -->
    <section class="meals" id="meals" aria-label="当日食谱"></section>
  </main>

  <footer class="app-footer">
    <p>怎么吃 · 用心对待每一顿饭</p>
  </footer>

  <!-- 详情页浮层 -->
  <div id="detailOverlay" class="detail-overlay" aria-hidden="true">
    <div class="detail-sheet">
      <button id="detailClose" class="detail-close" aria-label="返回">‹</button>
      <div id="detailContent" class="detail-content"></div>
    </div>
  </div>

  <!-- 随机结果弹层 -->
  <div id="pickOverlay" class="pick-overlay" aria-hidden="true">
    <div class="pick-card">
      <button id="pickClose" class="pick-close" aria-label="关闭">✕</button>
      <div class="pick-emoji" id="pickEmoji">🍖</div>
      <h3 class="pick-title" id="pickTitle">红烧肉</h3>
      <p class="pick-desc" id="pickDesc">肥而不腻、入口即化的经典家常硬菜。</p>
      <div class="pick-meta" id="pickMeta">⏱ 90 分钟 · 中等 · 3 人份</div>
      <button id="pickDetail" class="pick-btn">查看做法 →</button>
      <button id="pickAgain" class="pick-again">🎲 换一个</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
